<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 360px; margin: 0; font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: #172b4d; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #ebecf0; font-weight: 600; }
  .head img { width: 20px; height: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
  .row + .row { border-top: 1px solid #f4f5f7; }
  .tip { padding: 8px 12px 10px; color: #6b778c; font-size: 12px; border-top: 1px solid #ebecf0; }
  .actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #f4f5f7; }
  .actions button { flex: 1; padding: 5px 0; font-size: 12px; color: #0052cc; background: #f4f5f7; border: 1px solid #dfe1e6; border-radius: 3px; cursor: pointer; }
  .actions button:hover { background: #ebecf0; }
  .sites { padding: 10px 12px; border-top: 1px solid #ebecf0; }
  .sites-title { font-weight: 600; }
  .sites-desc { margin: 2px 0 8px; color: #6b778c; font-size: 12px; }
  .site-add { display: flex; gap: 6px; }
  .site-add input { min-width: 0; flex: 1; padding: 5px 7px; color: #172b4d; border: 1px solid #dfe1e6; border-radius: 3px; }
  .site-add input:focus { border-color: #4c9aff; outline: none; box-shadow: 0 0 0 1px #4c9aff; }
  .site-add button, .site-item button { padding: 5px 9px; color: #0052cc; background: #f4f5f7; border: 1px solid #dfe1e6; border-radius: 3px; cursor: pointer; }
  .site-add button:disabled, .site-item button:disabled { cursor: default; color: #a5adba; }
  .site-status { min-height: 19px; margin-top: 5px; color: #006644; font-size: 12px; }
  .site-status.error { color: #bf2600; }
  .site-list { margin-top: 4px; }
  .site-empty { color: #6b778c; font-size: 12px; }
  .site-item { display: flex; align-items: center; gap: 6px; padding-top: 6px; }
  .site-origin { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .site-permission { flex: none; color: #bf2600; font-size: 11px; }
  .site-item button { flex: none; padding: 2px 7px; font-size: 11px; }
  .help { padding: 10px 12px; border-top: 1px solid #ebecf0; background: #fafbfc; }
  .help-title { margin-bottom: 4px; font-weight: 600; }
  .help ul { margin: 0; padding-left: 18px; color: #42526e; font-size: 12px; }
  .help li + li { margin-top: 3px; }

  /* 开关样式 */
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch span { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 10px; background: #dfe1e6; transition: background .15s; pointer-events: none; }
  .switch span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked + span { background: #36b37e; }
  .switch input:checked + span::after { left: 18px; }
</style>
</head>
<body>
  <div class="head"><img src="icons/icon32.png" alt="">Wiki Mermaid 渲染</div>

  <div class="row">
    <span>启用渲染</span>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </div>

  <div class="row">
    <span>大图默认折叠</span>
    <label class="switch"><input type="checkbox" id="collapseLarge"><span></span></label>
  </div>

  <div class="actions">
    <button type="button" id="collapse-all">全部收缩</button>
    <button type="button" id="expand-all">全部展开</button>
  </div>

  <div class="sites">
    <div class="sites-title">自定义 Wiki 站点</div>
    <div class="sites-desc">已内置 https://*.atlassian.net/wiki/*；粘贴页面地址或包含地址的文本会自动截取站点</div>
    <form class="site-add" id="site-add-form">
      <input type="text" id="site-input" inputmode="url" placeholder="粘贴 Wiki 页面地址" aria-label="自定义 Wiki 地址" disabled>
      <button type="submit" id="site-add-button" disabled>添加</button>
    </form>
    <div class="site-status" id="site-status" role="status" aria-live="polite"></div>
    <div class="site-list" id="site-list"></div>
  </div>

  <div class="help">
    <div class="help-title">使用提示</div>
    <ul>
      <li>默认可框选并复制图中文字</li>
      <li>超宽图首次显示时自动适应当前内容宽度</li>
      <li>拖动模式下，滚轮缩放图形，四周可拖出当前视图 50% 的留白</li>
      <li>按 Esc 可退出当前拖动或全屏状态</li>
      <li>退出全屏后恢复进入前状态</li>
    </ul>
  </div>

  <div class="tip">开关对已打开的 Wiki 页即时生效；新增自定义站点后刷新对应页面，收缩/展开按钮作用于当前标签页</div>

  <script src="site-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
